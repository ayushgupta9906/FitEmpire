<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitEmpire - Unified Platform Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07080a;
      --bg-card: rgba(18, 20, 26, 0.75);
      --primary: #6C63FF;
      --secondary: #06b6d4;
      --accent: #10b981;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Clean Header with Logo and Live Status */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 10, 0.85);
      backdrop-filter: blur(16px);
      z-index: 20;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .logo-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.35);
    }

    .logo-text {
      font-weight: 800;
      color: #FFFFFF;
      font-size: 1.45rem;
      letter-spacing: -0.5px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pulse {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: blink 1.5s infinite;
    }

    .header-subtext {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    /* 3-Column Workspace */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 28% 28% 44%;
      padding: 0.85rem 1.5rem 1rem 1.5rem;
      gap: 1.5rem;
      height: calc(100vh - 62px);
      align-items: stretch;
    }

    .pane {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
    }

    /* Prominent Live Link Header on Screen */
    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    .pane-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      letter-spacing: -0.2px;
    }

    .live-link-btn {
      font-size: 0.78rem;
      font-weight: 800;
      color: #FFFFFF;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .live-link-member {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #F8FAFC;
    }

    .live-link-member:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .live-link-partner {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: #38BDF8;
    }

    .live-link-partner:hover {
      background: rgba(59, 130, 246, 0.35);
      border-color: rgba(59, 130, 246, 0.6);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .live-link-admin {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.35) 0%, rgba(79, 70, 229, 0.5) 100%);
      border: 1px solid rgba(108, 99, 255, 0.55);
      color: #C7D2FE;
    }

    .live-link-admin:hover {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.55) 0%, rgba(79, 70, 229, 0.7) 100%);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .frame-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0.75rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
    }

    .device-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(18, 20, 26, 0.88);
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      backdrop-filter: blur(8px);
    }

    .device-badge span {
      color: var(--accent);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 800;
    }

    /* 1. Phone Frame (Member & Partner) */
    .iphone-frame {
      width: 100%;
      max-width: 375px;
      height: 98%;
      max-height: 820px;
      background: #000;
      border-radius: 42px;
      border: 8px solid #1a1a24;
      position: relative;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), 0 0 30px rgba(108, 99, 255, 0.15);
      overflow: hidden;
    }

    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 20px;
      background: #000;
      border-radius: 16px;
      z-index: 100;
    }

    .iphone-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #070B14;
      overflow: hidden;
    }

    /* 2. Web Browser Mockup (Admin) */
    .browser-frame {
      width: 100%;
      height: 100%;
      background: #0d0e12;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7);
    }

    .browser-header {
      background: #15171e;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 0.85rem;
      gap: 0.4rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .browser-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .dot-red {
      background-color: #ef4444;
    }

    .dot-yellow {
      background-color: #f59e0b;
    }

    .dot-green {
      background-color: #10b981;
    }

    .browser-address {
      flex: 1;
      background: #0d0e12;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      height: 22px;
      margin: 0 0.85rem;
      display: flex;
      align-items: center;
      padding: 0 0.65rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .browser-frame iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #0B0D14;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 1200px) {
      body {
        overflow: auto;
        height: auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        gap: 2rem;
      }

      .iphone-frame {
        height: 680px;
      }

      .browser-frame {
        height: 550px;
      }
    }
  </style>
</head>

<body>

  <!-- Minimal Clean Header without Right Corner Buttons -->
  <header>
    <div class="logo-container">
      <div class="logo-icon-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F46E5"
          stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="transform: scaleX(-1);">
          <path d="M14.4 14.4 9.6 9.6" />
          <path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l.707-.707a2 2 0 1 1 2.829 2.828z" />
          <path d="m21.5 21.5-1.4-1.4" />
          <path d="M3.929 6.757a2 2 0 1 1 2.828-2.828l.707.707a2 2 0 1 1-2.828 2.828z" />
          <path d="m2.5 2.5 1.4 1.4" />
          <path d="m8.5 11.5-2.1-2.1a2 2 0 1 1 2.8-2.8l2.1 2.1" />
          <path d="m15.5 18.5-2.1-2.1a2 2 0 1 1 2.8-2.8l2.1 2.1" />
        </svg>
      </div>
      <span class="logo-text">FitEmpire</span>
      <div class="badge">
        <span class="pulse"></span>
        Live Production
      </div>
    </div>

  </header>

  <!-- 3-Screen Live Grid with Live Link Button on Each Screen -->
  <main class="workspace">
    <!-- 1. Member Mobile App Viewport -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-title">📱 Member App</span>
        <a href="https://firmempireapp.netlify.app" target="_blank" class="live-link-btn live-link-member">
          ⚡ Live Link ↗
        </a>
      </div>
      <div class="frame-container">
        <div class="device-badge">Member Mobile <span>Active</span></div>
        <div class="iphone-frame">
          <iframe src="https://firmempireapp.netlify.app" title="FitEmpire Member App" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <!-- 2. Gym Partner App Viewport -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-title">🏢 Partner App</span>
        <a href="https://fitempirepartner.netlify.app" target="_blank" class="live-link-btn live-link-partner">
          ⚡ Live Link ↗
        </a>
      </div>
      <div class="frame-container">
        <div class="device-badge">Partner Desk <span>Active</span></div>
        <div class="iphone-frame">
          <iframe src="https://fitempirepartner.netlify.app" title="FitEmpire Partner App" scrolling="no"></iframe>
        </div>
      </div>
    </div>

    <!-- 3. Super Admin Console Viewport -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-title">🛡️ Admin Console</span>
        <a href="https://fitempire.netlify.app" target="_blank" class="live-link-btn live-link-admin">
          ⚡ Live Link ↗
        </a>
      </div>
      <div class="frame-container">
        <div class="device-badge">Admin Dashboard <span>Live</span></div>
        <div class="browser-frame">
          <div class="browser-header">
            <div class="browser-dot dot-red"></div>
            <div class="browser-dot dot-yellow"></div>
            <div class="browser-dot dot-green"></div>
            <div class="browser-address">https://fitempire.netlify.app/dashboard</div>
          </div>
          <iframe src="https://fitempire.netlify.app" title="FitEmpire Admin Console"></iframe>
        </div>
      </div>
    </div>
  </main>

</body>

</html>
