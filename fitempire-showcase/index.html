<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitEmpire - Live Interactive Showcase Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07080a;
      --bg-card: rgba(18, 20, 26, 0.7);
      --primary: #7C3AED;
      --secondary: #06b6d4;
      --accent: #10b981;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 8, 10, 0.8);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.75rem;
      letter-spacing: -0.5px;
    }

    .badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pulse {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    .actions {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Main Console Workspace */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 42% 58%;
      padding: 1.5rem 2rem;
      gap: 2rem;
      height: calc(100vh - 70px);
      align-items: stretch;
    }

    .pane {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .pane-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-link {
      font-size: 0.8rem;
      color: var(--secondary);
      text-decoration: none;
    }

    .pane-link:hover {
      text-decoration: underline;
    }

    .frame-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
    }

    /* Device Mockups */
    /* 1. iPhone 15 Mockup */
    .iphone-frame {
      width: 330px;
      height: 670px;
      background: #000;
      border-radius: 46px;
      border: 10px solid #1a1a1f;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .iphone-frame::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 85px;
      height: 25px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    .iphone-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* 2. Web Browser Mockup */
    .browser-frame {
      width: 100%;
      height: 100%;
      background: #0d0e12;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .browser-header {
      background: #15171e;
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .browser-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red { background-color: #ef4444; }
    .dot-yellow { background-color: #f59e0b; }
    .dot-green { background-color: #10b981; }

    .browser-address {
      flex: 1;
      background: #0d0e12;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      height: 24px;
      margin: 0 1rem;
      display: flex;
      align-items: center;
      padding: 0 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .browser-frame iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #111;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Responsiveness warning */
    @media (max-width: 1024px) {
      body {
        overflow: auto;
        height: auto;
      }
      .workspace {
        grid-template-columns: 1fr;
        height: auto;
        gap: 3rem;
      }
      .iphone-frame {
        height: 640px;
      }
      .browser-frame {
        height: 550px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div style="width: 34px; height: 34px; border-radius: 9px; background-color: #7C3AED; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(124, 58, 237, 0.45);">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6.5 6.5 11 11"/>
          <path d="m21 21-1-1"/>
          <path d="m3 3 1 1"/>
          <path d="m18 22 4-4"/>
          <path d="m2 6 4-4"/>
          <path d="m3 10 7-7"/>
          <path d="m14 21 7-7"/>
          <path d="M6.5 12.5 12.5 6.5"/>
          <path d="m11.5 17.5 6-6"/>
        </svg>
      </div>
      <span class="logo-icon" style="background: linear-gradient(135deg, #7C3AED 0%, #06b6d4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">FitEmpire</span>
      <div class="badge">
        <span class="pulse"></span>
        Interactive Showcase Live
      </div>
    </div>
    <div class="actions">
      <a href="https://firmempireapp.netlify.app" target="_blank" class="btn btn-outline">
        Open Mobile App Tab ↗
      </a>
      <a href="https://fitempire.netlify.app" target="_blank" class="btn btn-primary">
        Open Admin Console ↗
      </a>
    </div>
  </header>

  <main class="workspace">
    <!-- Mobile App Viewport -->
    <div class="pane">
      <div class="pane-title">
        <span>MOBILE APP CLIENT</span>
        <a href="https://firmempireapp.netlify.app" target="_blank" class="pane-link">Live Link ↗</a>
      </div>
      <div class="frame-container">
        <div class="iphone-frame">
          <iframe src="https://firmempireapp.netlify.app" title="FitEmpire Mobile App"></iframe>
        </div>
      </div>
    </div>

    <!-- Admin Panel Viewport -->
    <div class="pane">
      <div class="pane-title">
        <span>ADMIN MANAGEMENT SYSTEM</span>
        <a href="https://fitempire.netlify.app" target="_blank" class="pane-link">Live Link ↗</a>
      </div>
      <div class="frame-container">
        <div class="browser-frame">
          <div class="browser-header">
            <div class="browser-dot dot-red"></div>
            <div class="browser-dot dot-yellow"></div>
            <div class="browser-dot dot-green"></div>
            <div class="browser-address">https://fitempire.netlify.app/admin</div>
          </div>
          <iframe src="https://fitempire.netlify.app" title="FitEmpire Admin Dashboard"></iframe>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
