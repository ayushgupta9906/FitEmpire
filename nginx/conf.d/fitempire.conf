# ── API Virtual Host ─────────────────────────────────────────
server {
    listen 80;
    server_name api.fitempire.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.fitempire.in;

    ssl_certificate     /etc/ssl/fitempire/fullchain.pem;
    ssl_certificate_key /etc/ssl/fitempire/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;

    limit_conn conn_limit 20;

    # Auth endpoints — stricter rate limit
    location ~ ^/api/v[0-9]+/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fitempire_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Webhook endpoints — no rate limit
    location ~ ^/api/v[0-9]+/payments/webhook {
        proxy_pass http://fitempire_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # All other API endpoints
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://fitempire_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Swagger UI
    location /api/swagger-ui/ {
        proxy_pass http://fitempire_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Actuator — internal only
    location /api/v1/actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://fitempire_backend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}

# ── Admin Dashboard Virtual Host ─────────────────────────────
server {
    listen 80;
    server_name admin.fitempire.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.fitempire.in;

    ssl_certificate     /etc/ssl/fitempire/fullchain.pem;
    ssl_certificate_key /etc/ssl/fitempire/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    root /usr/share/nginx/html;

    location / {
        proxy_pass http://fitempire_admin;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
